name: Linux Arch x64

on: [push]

jobs:
    build-archlinux:
        runs-on: ubuntu-latest
        name: build-archlinux-qt5

        steps:
            # 检出代码到 'mayo' 目录
            - name: Checkout
              uses: actions/checkout@v2
              with:
                  path: 'mayo'

            # 安装 Podman 并拉取 Arch Linux 镜像
            - name: Setup Podman
              run: |
                  sudo apt update 
                  sudo apt-get -y install podman 
                  podman pull docker.io/library/archlinux:latest  

            # 创建容器并运行构建和测试
            - name: Create container and run build+tests
              run: |
                  { 
                      echo 'FROM archlinux:latest' 
                      echo 'RUN pacman -Syu --noconfirm' 
                      echo 'RUN pacman -Sy --noconfirm make cmake git gcc' 
                      echo 'RUN pacman -Sy --noconfirm qt5-base qt5-svg xcb-util-cursor' 
                      echo 'RUN pacman -Sy --noconfirm opencascade libxi' 
                      echo 'RUN pacman -Sy --noconfirm assimp' 
                      echo 'COPY mayo mayo' 
                      echo 'RUN mkdir /mayo/build' 
                      echo 'WORKDIR /mayo/build' 
                      echo 'RUN cmake.. -DMayo_BuildTests=ON -DMayo_BuildPluginAssimp=ON' 
                      echo 'RUN cmake --build. --parallel --config Release' 
                  } > podmanfile 
                  podman build --tag archlinux-ci -f./podmanfile 
                  
                  # 假设构建产物在 /mayo/build 下，这里可以根据实际情况修改 
                  mkdir -p artifacts 
                  podman run --rm -v $(pwd)/artifacts:/output archlinux-ci cp -r /mayo/build/. /output 

            # 上传构建产物
            - name: Upload build artifacts
              uses: actions/upload-artifact@v2
              with:
                  name: mayo-build-artifact
                  path: artifacts

            # 输出下载包地址
            - name: Output download link
              run: |
                  PACKAGE_DOWNLOAD_URL="https://github.com/${{  github.repository  }}/actions/runs/${{ github.run_id  }}/artifacts/${{ github.run_number  }}" 
                  echo "::set-output name=package_download_url::$PACKAGE_DOWNLOAD_URL" 
                  echo "The package can be downloaded from: $PACKAGE_DOWNLOAD_URL" 
